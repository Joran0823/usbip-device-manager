name: Build (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
  # 创建 Release（tag 以 v 或 V 开头，例如 v1.0.0 / V1.2.3）时自动构建并上传。
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Release tag（v*/V*）时把 tag 注入为版本号，供 build.rs 生成
      # APP_VERSION（如 tag V1.0.0 -> 标题栏/文件版本 V1.0.0）。
      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            echo "app_version=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=" >> "$GITHUB_OUTPUT"
          fi

      # Release 构建前把 Cargo.toml 版本同步为 tag 版本（去掉 v/V 前缀），
      # 使编译横幅/包版本与 Release 一致；cargo 会自动同步 Cargo.lock。
      - name: Sync Cargo.toml version with release tag
        if: steps.version.outputs.app_version != ''
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          ver="${APP_VERSION#v}"
          ver="${ver#V}"
          sed -i -E "s/^version = \".*\"/version = \"${ver}\"/" Cargo.toml
          echo "Cargo.toml version -> ${ver}"

      - name: Test
        env:
          USBIP_DEVICE_MANAGER_VERSION: ${{ steps.version.outputs.app_version }}
        run: cargo test --release

      - name: Build release
        env:
          USBIP_DEVICE_MANAGER_VERSION: ${{ steps.version.outputs.app_version }}
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbip-device-manager-windows-x64
          path: target/release/usbip-device-manager.exe
          if-no-files-found: error

      # Release 已发布（tag 以 v/V 开头）时，把构建物挂到对应 Release 下。
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/usbip-device-manager.exe
          fail_on_unmatched_files: true
          overwrite_files: true
